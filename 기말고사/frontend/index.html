<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>정적 사이트 데모 - 로그인 & 업로드</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>정적 사이트 데모</h1>
      <p class="muted">클라이언트 사이드 로그인과 파일 업로드 데모</p>
    </header>

    <section id="login-section" class="card">
      <h2>로그인</h2>
      <form id="login-form">
        <label>
          아이디
          <input id="id-input" type="text" placeholder="아이디를 입력하세요" required>
        </label>
        <button type="submit" id="login-btn">로그인</button>
      </form>
      <p class="muted small" style="margin-top:12px;margin-bottom:0;">계정이 없으신가요? <a href="#" id="signup-toggle" style="color:var(--accent);cursor:pointer;text-decoration:none;">회원가입</a></p>
    </section>

    <section id="signup-section" class="card hidden">
      <h2>회원가입</h2>
      <form id="signup-form">
        <label>
          아이디
          <input id="signup-id-input" type="text" placeholder="아이디를 입력하세요" required>
        </label>
        <div class="actions">
          <button type="submit" id="signup-btn">회원가입</button>
          <button type="button" id="signup-cancel" style="background:var(--muted);">취소</button>
        </div>
      </form>
    </section>

    <section id="dashboard" class="card hidden">
      <div class="topbar">
        <div>환영합니다, <span id="display-user"></span></div>
        <button id="logout">로그아웃</button>
      </div>

      <h2>파일 업로드</h2>
      <form id="upload-form">
        <label>업로드할 파일 선택 (PDF만 가능)
          <input id="file-input" type="file" accept=".pdf,application/pdf" />
        </label>
        <label style="display:block;margin-top:8px;">키워드 (콤마로 구분, 비워두면 자동선정)
          <input id="keyword-input" type="text" placeholder="예: 알고리즘,자료구조" />
        </label>
        <div class="preview" id="file-preview"></div>
        <div class="actions">
          <button id="upload-btn" type="button">업로드</button>
        </div>
      </form>

      <h3>업로드 목록</h3>
      <ul id="uploads-list" class="uploads"></ul>

      <div class="actions" style="margin-top:12px;">
        <button id="check-btn" type="button" disabled>통합 검사</button>
      </div>

      <p class="muted small">참고: 서버 업로드 엔드포인트가 없으면 브라우저에서 시뮬레이션합니다.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
