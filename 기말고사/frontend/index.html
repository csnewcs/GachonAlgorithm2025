<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로토타입 서비스</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 50px; background-color: #f8f9fa; }
        .container { max-width: 600px; }
        .hidden { display: none; }
        .card { margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">문서 분석 서비스</h2>

    <div id="alertBox" class="alert hidden" role="alert"></div>

    <div id="authSection">
        <ul class="nav nav-tabs mb-3" id="authTab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">로그인</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="signup-tab" data-bs-toggle="tab" data-bs-target="#signup" type="button">회원가입</button>
            </li>
        </ul>
        <div class="tab-content" id="authTabContent">
            <div class="tab-pane fade show active" id="login">
                <div class="card p-4">
                    <div class="mb-3">
                        <label for="loginUsername" class="form-label">사용자 이름</label>
                        <input type="text" class="form-control" id="loginUsername" placeholder="이름 입력">
                    </div>
                    <button onclick="handleLogin()" class="btn btn-primary w-100">로그인</button>
                </div>
            </div>
            <div class="tab-pane fade" id="signup">
                <div class="card p-4">
                    <div class="mb-3">
                        <label for="signupUsername" class="form-label">사용자 이름</label>
                        <input type="text" class="form-control" id="signupUsername" placeholder="새 이름 입력">
                    </div>
                    <button onclick="handleSignup()" class="btn btn-success w-100">가입하기</button>
                </div>
            </div>
        </div>
    </div>

    <div id="dashboardSection" class="hidden">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 id="welcomeMsg">환영합니다!</h4>
            <button onclick="logout()" class="btn btn-outline-secondary btn-sm">로그아웃</button>
        </div>

        <div class="card">
            <div class="card-header">PDF 파일 업로드</div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="uploadFile" class="form-label">파일 선택 (PDF)</label>
                    <input type="file" class="form-control" id="uploadFile" accept=".pdf">
                </div>
                <div class="mb-3">
                    <label for="uploadKeywords" class="form-label">키워드 (선택, 쉼표로 구분)</label>
                    <input type="text" class="form-control" id="uploadKeywords" placeholder="예: 계약서, 2024년">
                </div>
                <button onclick="handleUpload()" class="btn btn-primary">업로드</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">작업 수행</div>
            <div class="card-body">
                <h6 class="card-title">업로드된 파일 대기열</h6>
                <ul id="uploadedFileList" class="list-group list-group-flush mb-3">
                    <li class="list-group-item text-muted small">아직 업로드된 파일이 없습니다.</li>
                </ul>
                
                <p class="card-text small text-secondary">위 파일들을 기반으로 분석을 시작합니다.</p>
                <button onclick="handleCheckAll()" class="btn btn-warning w-100">분석 시작 (Check All)</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>리포트 목록</span>
                <button onclick="fetchReports()" class="btn btn-sm btn-outline-primary">새로고침</button>
            </div>
            <ul class="list-group list-group-flush" id="reportList">
                <li class="list-group-item text-center text-muted">리포트가 없습니다.</li>
            </ul>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // API 설정 (실제 백엔드 주소로 변경 필요)
    const API_BASE_URL = 'https://localhost:8080'; 
    
    // 상태 관리 변수
    let currentUserId = null;
    let currentUsername = null;
    let uploadedFiles = []

    // 유틸리티: 알림 표시
    function showAlert(message, type = 'success') {
        const alertBox = document.getElementById('alertBox');
        alertBox.className = `alert alert-${type}`;
        alertBox.textContent = message;
        alertBox.classList.remove('hidden');
        setTimeout(() => alertBox.classList.add('hidden'), 3000);
    }

    // 1. 회원가입 (/signup)
    async function handleSignup() {
        const username = document.getElementById('signupUsername').value;
        if (!username) return showAlert('이름을 입력해주세요.', 'danger');

        try {
            const res = await fetch(`${API_BASE_URL}/signup`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });

            if (res.status === 200) {
                showAlert('가입 완료! 로그인해주세요.');
                document.getElementById('login-tab').click(); // 로그인 탭으로 이동
            } else if (res.status === 409) {
                showAlert('이미 존재하는 ID입니다.', 'warning');
            } else {
                showAlert('가입 실패: ' + res.status, 'danger');
            }
        } catch (err) {
            console.error(err);
            showAlert('서버 연결 오류', 'danger');
        }
    }

    // 2. 로그인 (/login)
    async function handleLogin() {
        const username = document.getElementById('loginUsername').value;
        if (!username) return showAlert('이름을 입력해주세요.', 'danger');

        try {
            const res = await fetch(`${API_BASE_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });

            if (res.status === 200) {
                const data = await res.json();
                currentUserId = data.user_id;
                currentUsername = username;
                
                document.getElementById('welcomeMsg').textContent = `${username}님 안녕하세요!`;
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                
                showAlert('로그인 성공!');
                
                // [추가됨] 로그인 시 서버에 있는 데이터 로드
                fetchUploadedFiles(); // 업로드된 파일 목록 로드
                fetchReports();       // 리포트 목록 로드
            } else if (res.status === 404) {
                showAlert('존재하지 않는 ID입니다.', 'danger');
            } else {
                showAlert('로그인 실패', 'danger');
            }
        } catch (err) {
            console.error(err);
            showAlert('서버 연결 오류', 'danger');
        }
    }

    // 3. 파일 업로드 (/file)
    async function handleUpload() {
       // 1. DOM 요소 가져오기 (이 부분이 누락되어 있었습니다)
        const fileInput = document.getElementById('uploadFile');
        const keywords = document.getElementById('uploadKeywords').value;

        // 2. 파일 선택 여부 검사
        if (fileInput.files.length === 0) return showAlert('파일을 선택해주세요.', 'danger');

        // 3. FormData 생성 및 데이터 추가 (이 부분이 누락되어 있었습니다)
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('user_id', currentUserId);
        
        // 키워드가 있을 경우에만 추가
        if (keywords) {
            formData.append('keywords', keywords);
        }

        try {
            // 코드에 적어주신 대로 '/file' 엔드포인트로 POST 요청
            const res = await fetch(`${API_BASE_URL}/file`, {
                method: 'POST',
                body: formData
            });

            if (res.status === 200) {
                const data = await res.json();
                
                showAlert(`업로드 성공!`);
                fileInput.value = ''; // 파일 입력 초기화
                document.getElementById('uploadKeywords').value = ''; // 키워드 입력도 초기화해주면 좋습니다
                
                // 서버 목록 다시 불러오기 (동기화)
                fetchUploadedFiles(); 
            } else {
                showAlert('업로드 실패', 'danger');
            }
        } catch (err) {
            console.error(err);
            showAlert('업로드 중 오류 발생', 'danger');
        }
    }
    function renderUploadedFiles(files) {
        const listEl = document.getElementById('uploadedFileList');
        listEl.innerHTML = ''; // 초기화

        if (!files || files.length === 0) {
            listEl.innerHTML = '<li class="list-group-item text-muted small">아직 업로드된 파일이 없습니다.</li>';
            return;
        }

        files.forEach(file => {
            // file 객체 구조: { original_filename: "...", path: "..." }
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `
                <div class="text-truncate" style="max-width: 80%;" title="${file.original_filename}">
                    📄 ${file.original_filename}
                </div>
                <span class="badge bg-secondary rounded-pill" style="font-size: 0.7em;">Saved</span>
            `;
            listEl.appendChild(li);
        });
    }
    async function fetchUploadedFiles() {
        try {
            const res = await fetch(`${API_BASE_URL}/file/${currentUserId}`, {
                method: 'GET'
            });

            if (res.status === 200) {
                const data = await res.json();
                // data.files 배열을 렌더링 함수로 전달
                renderUploadedFiles(data.files);
            } else {
                console.error('파일 목록 조회 실패');
            }
        } catch (err) {
            console.error(err);
        }
    }

    // 4. 확인 시작 (/check_all)
    async function handleCheckAll() {
        try {
            // 주의: 명세서에는 GET 요청에 Body를 넣으라고 되어 있으나, 
            // 브라우저 fetch에서는 GET Body가 금지되어 있습니다.
            // 따라서 query string으로 user_id를 보냅니다.
            const res = await fetch(`${API_BASE_URL}/check_all?user_id=${currentUserId}`, {
                method: 'GET'
            });

            if (res.status === 200) {
                showAlert('작업이 시작되었습니다. 잠시 후 리포트를 확인하세요.');
                setTimeout(fetchReports, 2000); // 2초 후 리스트 갱신 시도
            } else {
                showAlert('작업 시작 실패 (파일 없음 등)', 'warning');
            }
        } catch (err) {
            console.error(err);
            showAlert('오류 발생', 'danger');
        }
    }

    // 5. 리포트 리스트 조회 (/reports/<user_id>)
    async function fetchReports() {
        try {
            // 1. 리포트 파일명 목록 가져오기
            const res = await fetch(`${API_BASE_URL}/reports/${currentUserId}`, {
                method: 'GET'
            });

            if (res.status === 200) {
                const data = await res.json();
                const reportNames = data.reports;
                
                // 2. 각 리포트의 상세 메타데이터 가져오기 (비동기 병렬 처리)
                // 목록에 있는 이름마다 /reports/<id>/<filename> API를 호출합니다.
                const reportDetailsPromises = reportNames.map(async (filename) => {
                    try {
                        const metaRes = await fetch(`${API_BASE_URL}/reports/${currentUserId}/${filename}`);
                        if (metaRes.status === 200) {
                            const metaData = await metaRes.json();
                            return { filename, ...metaData, error: false };
                        }
                    } catch (e) { console.error(e); }
                    return { filename, error: true };
                });

                const reportsWithMeta = await Promise.all(reportDetailsPromises);
                renderReportList(reportsWithMeta);

            } else {
                console.error("리스트 조회 실패");
            }
        } catch (err) {
            console.error(err);
        }
    }

    // 리포트 목록 렌더링 및 다운로드 링크 생성
    function renderReportList(reports) {
        const listEl = document.getElementById('reportList');
        listEl.innerHTML = '';

        if (!reports || reports.length === 0) {
            listEl.innerHTML = '<li class="list-group-item text-center text-muted">생성된 리포트가 없습니다.</li>';
            return;
        }

        reports.forEach(item => {
            const li = document.createElement('li');
            li.className = 'list-group-item';
            
            // 데이터가 정상적으로 로드되었는지 확인
            if (item.error) {
                li.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <span>${item.filename}</span>
                        <span class="text-danger small">정보 로드 실패</span>
                    </div>`;
            } else {
                // 다운로드(상세보기) 링크: /content 엔드포인트 사용
                const contentUrl = `${API_BASE_URL}/reports/${currentUserId}/${item.filename}/content`;
                
                // AI 생성 확률에 따른 색상 구분 (예: 50% 이상이면 경고색)
                const aiBadgeClass = item.ai_generated >= 50 ? 'bg-danger' : 'bg-success';

                li.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${item.filename}</strong>
                            <div class="mt-1">
                                <span class="badge bg-info text-dark me-1">유사도: ${(item.similarity_score * 100).toFixed(2)}%</span>
                                <span class="badge ${aiBadgeClass}">AI 확률: ${item.ai_generated}%</span>
                            </div>
                        </div>
                        <a href="${contentUrl}" target="_blank" class="btn btn-sm btn-outline-dark">
                            상세보기
                        </a>
                    </div>
                `;
            }
            listEl.appendChild(li);
        });
    }

    // 로그아웃
    function logout() {
        currentUserId = null;
        currentUsername = null;
        
        // UI 초기화
        document.getElementById('uploadedFileList').innerHTML = ''; 
        document.getElementById('reportList').innerHTML = '';
        
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('loginUsername').value = '';
        showAlert('로그아웃 되었습니다.', 'info');
    }
</script>
</body>
</html>
