<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>정적 사이트 데모 - 로그인 & 업로드</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Kakao SDK 로드 (head에서 먼저 로드) -->
  <script src="https://developers.kakao.com/sdk/js/kakao.js" async defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>정적 사이트 데모</h1>
      <p class="muted">클라이언트 사이드 로그인과 파일 업로드 데모</p>
    </header>

    <section id="login-section" class="card">
      <h2>Kakao로 로그인</h2>
      <p class="muted small">아래 버튼으로 Kakao 계정으로 로그인하세요.</p>
      <!-- 버튼이 렌더링될 곳 -->
      <div id="kakao-button" style="margin-top:12px"></div>
    </section>

    <section id="dashboard" class="card hidden">
      <div class="topbar">
        <div>환영, <span id="display-user"></span></div>
        <button id="logout">로그아웃</button>
      </div>

      <h2>파일 업로드</h2>
      <form id="upload-form">
        <label>업로드할 파일 선택
          <input id="file-input" type="file" />
        </label>
        <div class="preview" id="file-preview"></div>
        <div class="actions">
          <button id="upload-btn" type="button">업로드</button>
        </div>
      </form>

      <h3>업로드 목록</h3>
      <ul id="uploads-list" class="uploads"></ul>

      <p class="muted small">참고: 서버 업로드 엔드포인트가 없으면 브라우저에서 시뮬레이션합니다.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
